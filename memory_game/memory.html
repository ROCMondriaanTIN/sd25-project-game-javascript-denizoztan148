<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="../memory_game/css/memory.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

    <div class="card" id="7"></div>
    <div class="card" id="8"></div>
    <div class="card" id="9"></div>
    <div class="card" id="10"></div>
    <div class="card" id="11"></div>
    <div class="card" id="12"></div>
    <div class="card" id="13"></div>
    <div class="card" id="14"></div>
    <div class="card" id="15"></div>
</div>

<button id="restart"><b>RESTART</b></button>

<script src="../memory_game/js/memory.js" defer></script>
<script src="../memory_game/js/controle.js" defer></script>
<script src="../memory_game/js/start.js" defer></script>
<script src="../memory_game/js/view.js" defer></script>
</body>
</html>
